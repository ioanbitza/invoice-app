name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ioanbitza/sdlc-kit
          ref: 75b582f39547e35e665120292cbe3d96d4f8e0f5
          path: .sdlc-kit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: Gate (strict, manual checks must be ticked)
        run: node .sdlc-kit/tools/gate.mjs --strict
