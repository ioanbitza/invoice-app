name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ioanbitza/sdlc-kit
          ref: 4d29b9f0fb70e1fbff66432867b25d81df5219a0
          path: .sdlc-kit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: Gate (strict, manual checks must be ticked)
        run: node .sdlc-kit/tools/gate.mjs --strict
